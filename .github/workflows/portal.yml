name: Portal CI

# The docs claimed a CI gate for several phases while there was no .github
# directory at all. These are the things that have actually broken in this
# repository — a Dockerfile that would not build, a migration that only ran
# against PGlite, a backup script nobody had executed — so each one gets a job
# rather than a line in a runbook.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The portal lives in portal/ (PORTAL-INTEGRATION-PLAN.md §1.1). Every run:
# step below is written relative to the portal workspace root, so point the
# default working directory there rather than editing ~20 steps.
defaults:
  run:
    working-directory: portal

env:
  # Keep the toolchain pinned to what package.json's engines field allows and
  # what the Dockerfile ships, so CI cannot pass on a Node the image lacks.
  NODE_VERSION: "22"

jobs:
  # ── Build and the API suite ────────────────────────────────────────────────
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (contracts → api → web)
        run: npm run build

      - name: API test suite
        # The suite runs against PGlite in-process; no services needed.
        # `rm -rf apps/api/data` because a leftover PGlite directory from a
        # previous run makes tests fail in ways that look like real bugs.
        run: |
          rm -rf apps/api/data
          npm test

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            portal/apps/api/dist
            portal/apps/web/.next/build-manifest.json
          retention-days: 3
          if-no-files-found: ignore

  # ── Migrations against a real Postgres ─────────────────────────────────────
  # The test suite runs on PGlite. PGlite is close to Postgres but not
  # identical, and the schema leans hard on row-level security, partial unique
  # indexes and policy expressions. A migration that works on PGlite and fails
  # on Postgres would only be discovered on the school's server.
  migrations-postgres:
    name: Migrations on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci
      - run: npm run build -w @portal/contracts && npm run build -w @portal/api

      - name: Apply every migration, twice
        # verify-pg.mjs asserts the second run applies nothing: migrations must
        # be idempotent, because a redeploy runs them again.
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/portal
        run: node scripts/verify-pg.mjs

  # ── The container actually builds ──────────────────────────────────────────
  # The Dockerfile shipped with a stray '#' on a COPY line, so the image could
  # never be built at all. Nothing catches that except building it.
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build portal image
        uses: docker/build-push-action@v6
        with:
          context: portal
          push: false
          load: true
          tags: portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Portal image starts and reports its version
        run: docker run --rm --entrypoint node portal:ci --version

      # The site image, which the compose stack cannot run without. Building the
      # portal alone left the production path untested: the stack had api,
      # worker, web, backup and caddy, and nothing that served the marketing
      # site or proxied /portal.
      - name: Build site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Site image boots, refuses weak defaults, and serves
        run: |
          # 1. The production boot gate must refuse the published defaults.
          if docker run --rm -e NODE_ENV=production -e SESSION_SECRET=x \
               site:ci 2>&1 | grep -q "Refusing to start"; then
            echo "ok   boot gate refuses defaults"
          else
            echo "FAIL: site image booted on default credentials"; exit 1
          fi

          # 2. With real values it must actually serve.
          docker run -d --name site-ci -p 4040:4040 \
            -e NODE_ENV=production -e PORTAL_ENABLED=false \
            -e SESSION_SECRET=ci-only-secret-not-for-production \
            -e NEWS_ADMIN_PASSWORD=ci-only-password \
            -e STAFF_PASSCODE=ci-only-passcode \
            site:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4040/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4040/)
          if [ "$code" = "200" ]; then echo "ok   site image serves /";
          else echo "FAIL: site image / -> $code"; docker logs site-ci; exit 1; fi
          docker rm -f site-ci

          # 3. It must run as the non-root user the Dockerfile declares.
          uid=$(docker run --rm --entrypoint id -u site:ci 2>/dev/null || \
                docker run --rm --entrypoint id site:ci -u)
          case "$uid" in 0*|*"(root)"*) echo "FAIL: site image runs as root"; exit 1;;
                         *) echo "ok   site image runs as uid ${uid}";; esac

      # 4. The compose file must still resolve. `config` fails on an unknown
      #    service reference, a bad anchor or a missing required env var.
      - name: Compose stack resolves
        env:
          POSTGRES_OWNER_PASSWORD: ci-only
          APP_SECRET: ci-only-secret-value-at-least-32-characters
          SESSION_SECRET: ci-only-secret-not-for-production
          NEWS_ADMIN_PASSWORD: ci-only-password
          STAFF_PASSCODE: ci-only-passcode
          BACKUP_ENCRYPTION_KEY: ci-only-key
          BOOTSTRAP_ADMIN_EMAIL: admin@school.example
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap
        run: |
          cd portal
          docker compose config --quiet && echo "ok   compose config resolves"
          # The site must be in the graph and Caddy must depend on it, or the
          # domain silently goes back to serving only the portal.
          docker compose config --services | grep -qx site \
            || { echo "FAIL: compose has no site service"; exit 1; }
          docker compose config | grep -A3 '^  caddy:' | grep -q site \
            || { echo "FAIL: caddy does not depend on site"; exit 1; }
          echo "ok   site present, caddy points at it"

  # ── Backup and restore, end to end ─────────────────────────────────────────
  # The runbook promised encrypted, off-host, restore-tested backups. The only
  # way to know the scripts still do that is to run them: dump a real database,
  # encrypt it, restore it into a scratch one and check the data survived.
  backup-restore:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/portal
      BACKUP_ENCRYPTION_KEY: ci-only-not-a-real-key-0123456789
      BACKUP_DIR: ./backups
      BACKUP_HEARTBEAT_FILE: ./data/last-backup.json
      BACKUP_VERIFY_FILE: ./data/last-restore-test.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Postgres client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - run: npm ci
      - run: npm run build -w @portal/contracts && npm run build -w @portal/api

      - name: Populate a schema worth backing up
        run: node scripts/verify-pg.mjs

      - name: Take a backup
        run: ./scripts/backup.sh

      - name: Heartbeat is written and the dump is encrypted
        run: |
          set -euo pipefail
          test -s "$BACKUP_HEARTBEAT_FILE" || { echo "no heartbeat written"; exit 1; }
          cat "$BACKUP_HEARTBEAT_FILE"
          node -e '
            const h = require("fs").readFileSync(process.env.BACKUP_HEARTBEAT_FILE, "utf8");
            const j = JSON.parse(h);
            if (!j.completed_at || !j.sha256) { console.error("heartbeat incomplete", j); process.exit(1); }
            if (j.encrypted !== true) { console.error("backup is NOT encrypted"); process.exit(1); }
          '
          # A plaintext dump would contain the string "PostgreSQL database dump".
          dump="$(ls -1t "$BACKUP_DIR"/*.dump.enc | head -1)"
          if grep -aq "PostgreSQL database dump" "$dump"; then
            echo "FAIL: the stored backup is readable plaintext"; exit 1
          fi

      - name: Restore drill
        run: ./scripts/backup-verify.sh

      - name: Drill result is recorded for /api/v1/health
        run: |
          set -euo pipefail
          test -s "$BACKUP_VERIFY_FILE" || { echo "no drill result written"; exit 1; }
          cat "$BACKUP_VERIFY_FILE"
          node -e '
            const j = JSON.parse(require("fs").readFileSync(process.env.BACKUP_VERIFY_FILE, "utf8"));
            if (j.result !== "passed") { console.error("restore drill did not pass", j); process.exit(1); }
          '

  # ── The browser-facing stack, end to end ───────────────────────────────────
  # README and docs/go-live-plan both described a web smoke suite as a gate.
  # apps/web/test/smoke.mjs is real and has 56 assertions — it just never ran
  # anywhere except on somebody's laptop. It drives the BFF the way a browser
  # does: real cookies, real CSRF, real redirects, real MFA ceremony. Those are
  # exactly the things the API suite cannot see, because the API suite talks to
  # Nest directly and never goes through Next's proxy.
  web-smoke:
    name: Web smoke (BFF, cookies, CSRF)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Start the API
        # PGlite, so no database service is needed. SEED_DEMO gives the suite
        # the demo accounts it signs in as. The suite starts its own Paystack
        # mock on 9311, so one must NOT be started here — it would collide.
        env:
          WORKER_INPROC: "true"
          SEED_DEMO: "true"
          COOKIE_SECURE: "false"
          PAYSTACK_SECRET_KEY: sk_test_dev_secret
          PAYSTACK_API_BASE: http://127.0.0.1:9311
          PORT: "8080"
        run: |
          rm -rf apps/api/data
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          npx --yes wait-on -t 90000 http-get://127.0.0.1:8080/api/v1/health

      - name: Start the web app
        env:
          API_INTERNAL: http://127.0.0.1:8080
        run: |
          (cd apps/web && npx next start -H 0.0.0.0 -p 3000 > /tmp/web.log 2>&1 &)
          npx --yes wait-on -t 90000 http-get://127.0.0.1:3000/login

      - name: Smoke suite
        run: npm run smoke -w @portal/web

      - name: Server logs
        if: always()
        run: |
          echo "── api ──"; tail -n 200 /tmp/api.log || true
          echo "── web ──"; tail -n 200 /tmp/web.log || true

  # ── Load test ──────────────────────────────────────────────────────────────
  # README called k6 "a real CI gate" and docs/go-live-plan listed it as one.
  # It was neither: the script existed, nothing ran it. See
  # apps/api/loadtest/README.md for why the CI profile's latency threshold is
  # deliberately loose — a gate that fails on shared-runner noise is a gate
  # somebody turns off.
  loadtest:
    name: Load test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci
      - run: npm run build -w @portal/contracts && npm run build -w @portal/api

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq k6
          k6 version

      - name: Start the API with load-test rate-limit ceilings
        # The profile logs in on every iteration, which trips the production
        # login throttles by design. Those throttles are asserted in the
        # phase-6 and phase-7 suites; this job measures throughput.
        env:
          WORKER_INPROC: "true"
          SEED_DEMO: "true"
          COOKIE_SECURE: "false"
          PORT: "8080"
          RATE_LIMIT_LOGIN_MAX: "1000000"
          RATE_LIMIT_LOGIN_IP_MAX: "1000000"
          RATE_LIMIT_ACCT_OPS_IP_MAX: "1000000"
          RATE_LIMIT_GENERAL_MAX: "1000000"
          RATE_LIMIT_TOTP_MAX: "1000000"
        run: |
          rm -rf apps/api/data
          node apps/api/dist/main.js > /tmp/api-load.log 2>&1 &
          npx --yes wait-on -t 90000 http-get://127.0.0.1:8080/api/v1/health

      - name: Run the CI profile
        # Non-zero exit if a threshold is breached — that is the gate.
        run: k6 run -e PROFILE=ci -e BASE=http://127.0.0.1:8080 apps/api/loadtest/portal.js

      - name: API log
        if: always()
        run: tail -n 200 /tmp/api-load.log || true

  # ── Dependency advisories ──────────────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      # High and critical advisories fail the build. This repository shipped a
      # known SQL-injection advisory in drizzle-orm; nothing told anyone.
      - run: npm audit --audit-level=high
