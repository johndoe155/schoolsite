name: Site CI

# The marketing site has no build step and no unit tests — it is Express
# serving static HTML. What actually breaks here is a syntax error in
# server.js, a vendored token file drifting from its source, or a route
# that stops answering after a change to the middleware order (which is
# exactly what the portal proxy made fragile: it must stay ahead of the
# body parsers, express.static and the /api catch-all).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dependency advisories ───────────────────────────────────────────────────
  # Deliberately NOT `npm audit --audit-level=high`: that fails forever on the
  # braces/micromatch ReDoS, which has no patched release (npm's only "fix" is
  # a semver-major rewrite of Tailwind or a downgrade of the proxy). The gate
  # in scripts/audit-gate.mjs fails on advisories that ARE fixable in place and
  # prints the unfixable ones on every run so they stay visible.
  audit:
    name: Dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run audit:site

  site:
    name: Server boots and routes answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check scripts/portal.js
          node --check scripts/sync-tokens.js

      - name: Vendored tokens are in sync
        # portal/apps/web/app/tokens.css is a copy of
        # public/assets/css/tokens.css. If someone edits the source and
        # forgets `npm run tokens:sync`, the portal silently ships the old
        # palette — and the Docker build would not catch it.
        run: npm run tokens:check

      - name: Boot the site (portal disabled) and smoke every route
        env:
          PORT: 4040
          PORTAL_ENABLED: "false"
          SESSION_SECRET: ci-only-secret-not-for-production
          ADMIN_TOKEN: ci-only-token-0123456789abcdef
          NEWS_ADMIN_PASSWORD: ci-only-password
          STAFF_PASSCODE: ci-only-passcode
        run: |
          node server.js &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4040/api/health >/dev/null 2>&1 && break
            sleep 0.5
          done

          fail=0
          for p in / /programs.html /news.html /library.html \
                   /academies.html /contact.html /admin.html /privacy.html \
                   /newsletter-unsubscribed.html \
                   /api/health /api/posts /api/assets /api/gallery /api/config; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4040$p")
            if [ "$code" != "200" ]; then echo "FAIL $p -> $code"; fail=1; else echo "ok   $p"; fi
          done

          # ── Copy that must not drift ──────────────────────────────────
          # The address was typed out by hand in four pages and ended up as two
          # different addresses. site-info.js is now the single source; these
          # checks fail the build if a page starts carrying its own version
          # again, and they pin the two facts the school corrected: the
          # address, and the 2–3 business day reply promise.
          grep -rq "Tunde Iakunni" public/ \
            && { echo "FAIL: the misspelled academy address is back"; fail=1; }
          grep -rq "one business day" public/ \
            && { echo "FAIL: a form promises a reply in one business day"; fail=1; }
          # The school is in Oyo, not Ibadan. Three pages kept the old city in
          # a map caption, a quote attribution and a hero eyebrow long after the
          # street address was fixed — a visitor read both cities on one visit.
          grep -rq "Ibadan" public/ \
            && { echo "FAIL: a page still places the school in Ibadan"; fail=1; }
          grep -q "Osuntokun Avenue" public/assets/js/site-info.js \
            || { echo "FAIL: site-info.js lost the corrected address"; fail=1; }
          grep -Fq '2\\u20133 business days' public/assets/js/site-info.js \
            || { echo "FAIL: site-info.js lost the reply promise"; fail=1; }
          for page in / /index.html /contact.html /news.html /academies.html /privacy.html; do
            html=$(curl -fsS "http://127.0.0.1:4040$page")
            printf '%s' "$html" | grep -q "Osuntokun" \
              || { echo "FAIL $page does not carry the corrected address"; fail=1; }
          done
          curl -fsS http://127.0.0.1:4040/index.html | grep -q '/privacy.html' \
            || { echo "FAIL: the contact consent checkbox links to no privacy notice"; fail=1; }
          # Every page's footer links it, so a page cannot silently drop it.
          for page in / /contact.html /news.html /library.html /programs.html /academies.html /privacy.html /newsletter-unsubscribed.html; do
            curl -fsS "http://127.0.0.1:4040$page" | grep -q "site-info.js" \
              || { echo "FAIL $page does not load the shared facts"; fail=1; }
          done

          # The nav must still carry the portal entry point.
          curl -fsS http://127.0.0.1:4040/assets/js/nav.js | grep -q "'/portal'" \
            || { echo "FAIL: nav.js lost its Portal link"; fail=1; }
          curl -fsS http://127.0.0.1:4040/assets/js/layout.js | grep -q 'bic-footer-portal' \
            || { echo "FAIL: footer lost its portal link"; fail=1; }

          # P1-16: these headers used to reach every response EXCEPT the HTML
          # pages and /api/*, because the middleware that set them was
          # registered after the nonce middleware that ends HTML responses with
          # res.send(). Nothing caught it — the route loop above only checked
          # status codes. Assert it on a page, an asset, an API response and 404.
          check_headers() { # path
            h=$(curl -sI "http://127.0.0.1:4040$1")
            for want in x-content-type-options x-frame-options referrer-policy permissions-policy; do
              printf '%s' "$h" | grep -qi "^$want:" || { echo "FAIL $1 missing $want"; fail=1; }
            done
            printf '%s' "$h" | grep -qi "^content-security-policy:" || { echo "FAIL $1 missing CSP"; fail=1; }
          }
          check_headers /
          check_headers /news.html
          check_headers /assets/js/main.js
          check_headers /api/health
          check_headers /no-such-page

          # HSTS only behind TLS: sending it over plain http would pin a
          # browser to https on a host that cannot answer it.
          if curl -sI -H 'X-Forwarded-Proto: https' http://127.0.0.1:4040/ | grep -qi '^strict-transport-security:'; then
            echo "ok   HSTS present when TLS was used"
          else
            echo "FAIL: no Strict-Transport-Security behind TLS"; fail=1
          fi
          if curl -sI http://127.0.0.1:4040/ | grep -qi '^strict-transport-security:'; then
            echo "FAIL: HSTS sent over plain http"; fail=1
          fi

          exit $fail

  # ── The proxy, which the job above deliberately switches off ──────────────
  # Everything the integration added lives behind /portal: the Express→Next and
  # Express→NestJS proxies, the basePath, and the body-parser ordering. Testing
  # the site with PORTAL_ENABLED=false leaves all of it uncovered, which is how
  # the proxy shipped broken twice already (mount-path stripping, then the body
  # parsers swallowing POSTs).
  proxy:
    name: Site + portal through one origin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portal/package-lock.json

      - name: Install (site + portal)
        run: |
          npm ci
          npm run portal:install

      - name: Build the portal
        run: npm run portal:build

      - name: Boot all three processes and smoke through :4040 only
        env:
          PORT: 4040
          SESSION_SECRET: ci-only-secret-not-for-production
          ADMIN_TOKEN: ci-only-token-0123456789abcdef
          NEWS_ADMIN_PASSWORD: ci-only-password
          STAFF_PASSCODE: ci-only-passcode
        run: |
          npm run portal > /tmp/portal.log 2>&1 &
          PORTAL_PID=$!
          node server.js > /tmp/site.log 2>&1 &
          SITE_PID=$!
          trap 'kill $PORTAL_PID $SITE_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4040/portal/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done

          fail=0
          expect() { # path, expected status
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4040$1")
            if [ "$code" != "$2" ]; then echo "FAIL $1 -> $code (want $2)"; fail=1; else echo "ok   $1 $code"; fi
          }
          expect / 200
          expect /portal/login 200
          expect /portal/legal/privacy 200
          expect /portal 307
          expect /portal/api/v1/health 200
          expect /portal/api/v1/school 200
          expect /portal/api/v1/students 401     # auth gate still in front of routing
          expect /api/health 200                  # site API unaffected
          # Phase 8: installable portal + the page a teacher needs with no
          # signal. Both are static files under the web app's public dir, so
          # they are exactly the kind of thing a basePath mistake breaks.
          expect /portal/sw.js 200
          expect /portal/manifest.webmanifest 200
          expect /portal/offline-register 200
          expect /portal/icon-192.png 200

          # The redirect must carry the basePath, or every emailed link 404s.
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:4040/portal)
          case "$loc" in */portal/login) echo "ok   /portal redirects to $loc";;
                         *) echo "FAIL /portal redirected to $loc"; fail=1;; esac

          # A POST must reach the API with its body intact — this is exactly
          # what the body-parser ordering bug broke. The password has to clear
          # the DTO's 8-char minimum, or we would be asserting on a validation
          # 400 rather than on the credentials path.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"email":"nobody@school.example","password":"WrongPass123"}' \
            http://127.0.0.1:4040/portal/api/v1/auth/login)
          if [ "$code" != "401" ]; then echo "FAIL proxied POST login -> $code (want 401)"; fail=1;
          else echo "ok   proxied POST carries its body"; fi

          # The site's CSP must be on site pages and must not clobber the
          # portal's own nonce CSP.
          curl -fsS -D - -o /dev/null http://127.0.0.1:4040/ | grep -qi 'content-security-policy' \
            || { echo "FAIL: site has no CSP"; fail=1; }
          curl -fsS -D - -o /dev/null http://127.0.0.1:4040/portal/login | grep -qi 'nonce-' \
            || { echo "FAIL: portal lost its nonce CSP"; fail=1; }

          exit $fail
